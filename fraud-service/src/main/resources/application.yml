spring:
  application:
    name: fraud-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/fraud
    redis:
      host: localhost
      port: 6379

server:
  port: 8081  # actuator/health only; the service API is gRPC on 9090

grpc:
  server:
    port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # Distributed tracing (Phase 4, ADR-011): 100% sampling for the showcase.
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

fraud:
  rules:
    # minor units (cents): 10,000,000 = R$ 100,000.00
    amount-ceiling-minor: "10000000"
    velocity-max-transfers: 5
    velocity-window: 60s

logging:
  level:
    com.nexulor: INFO
