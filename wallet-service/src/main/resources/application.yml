spring:
  application:
    name: nexolor-wallet
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/nexolor
    username: nexolor
    password: nexolor
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    template:
      # injects W3C trace context into record headers (ADR-011)
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # consumers own their contract (tolerant reader): no type headers,
        # they map the envelope to their own payload class
        spring.json.add.type.headers: false

server:
  port: 8080

grpc:
  client:
    fraudService:
      address: static://localhost:9090
      negotiation-type: plaintext

fraud:
  client:
    deadline-millis: 2000

wallet:
  idempotency:
    # in-flight lock TTL: upper bound for fraud deadline + transfer tx;
    # a crashed holder releases the key after this
    lock-ttl: 30s
    # completed-outcome TTL: how long replays are answered from Redis
    record-ttl: 24h
  events:
    transaction-completed-topic: transaction-completed

resilience4j:
  # fraud deadline: a ceiling, not the expected latency (real responses are
  # sub-millisecond); must absorb cold TCP/HTTP-2 connection setup
  timelimiter:
    configs:
      fraud:
        timeout-duration: 300ms
        cancel-running-future: true
  retry:
    instances:
      fraud:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - io.grpc.StatusRuntimeException
        # REJECT is a business answer, not a failure: rejections come back as a
        # normal response and never reach this layer. Timeouts (already bounded
        # by the TimeLimiter) are not retried.
  circuitbreaker:
    configs:
      fraud:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      fraud:
        base-config: fraud

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true
  # Distributed tracing (Phase 4, ADR-011): 100% sampling for the showcase.
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.nexulor: INFO
