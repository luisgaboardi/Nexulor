syntax = "proto3";

package fraud.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.nexulor.grpc.fraud.v1";
option java_outer_classname = "FraudProto";

// Synchronous, latency-sensitive fraud evaluation invoked by the wallet
// service before committing a P2P transfer. Additive evolution only:
// never reuse or renumber existing fields.
service FraudEvaluationService {
  rpc EvaluateTransaction(EvaluateTransactionRequest) returns (EvaluateTransactionResponse);
}

message EvaluateTransactionRequest {
  string transfer_id = 1;          // generated by the wallet service
  string source_wallet_id = 2;
  string destination_wallet_id = 3;
  string amount_minor = 4;         // integer minor units (cents), avoids float artifacts
  string currency_code = 5;        // ISO-4217
  google.protobuf.Timestamp requested_at = 6;
}

message EvaluateTransactionResponse {
  Decision decision = 1;
  string rule_id = 2;              // identifier of the rule that fired ("" if none)
  string reason = 3;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  APPROVE = 1;
  REJECT = 2;
  REVIEW = 3;
}
