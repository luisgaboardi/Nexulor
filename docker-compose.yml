services:
  postgres:
    image: postgres:16-alpine
    container_name: nexolor-postgres
    environment:
      POSTGRES_DB: nexolor
      POSTGRES_USER: nexolor
      POSTGRES_PASSWORD: nexolor
    ports:
      - "5432:5432"
    volumes:
      - nexolor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexolor -d nexolor"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: nexolor-mongo
    ports:
      - "27017:27017"
    volumes:
      - nexolor_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexolor-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - nexolor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: nexolor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  fraud-service:
    build:
      context: .
      dockerfile: Dockerfile.fraud-service
    container_name: nexolor-fraud
    environment:
      SPRING_PROFILES_ACTIVE: redis-velocity
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/fraud
      SPRING_DATA_REDIS_HOST: redis
      GRPC_SERVER_PORT: "9090"
      FRAUD_RULES_AMOUNT_CEILING_MINOR: "10000000"
      FRAUD_RULES_VELOCITY_MAX_TRANSFERS: "5"
      FRAUD_RULES_VELOCITY_WINDOW: 60s
    ports:
      - "9090:9090"
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile.wallet-service
    container_name: nexolor-wallet
    environment:
      SPRING_PROFILES_ACTIVE: grpc-fraud
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexolor
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_CLIENT_FRAUDSERVICE_ADDRESS: static://fraud-service:9090
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    container_name: nexolor-gateway
    environment:
      SPRING_PROFILES_ACTIVE: jwt-local
      JWT_LOCAL_SECRET: local-demo-secret-change-me-0123456789abcdef
      WALLET_SERVICE_URL: http://wallet-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
    ports:
      - "8088:8088"
    depends_on:
      wallet-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    container_name: nexolor-notification
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/notifications
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nexolor_pg_data:
  nexolor_mongo_data:
  nexolor_redis_data:
