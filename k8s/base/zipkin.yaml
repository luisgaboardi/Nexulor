apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: nexolor
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nexolor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: nexolor
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports:
            - containerPort: 9411
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: nexolor
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: nexolor
spec:
  selector:
    app.kubernetes.io/name: zipkin
  ports:
    - name: http
      port: 9411
      targetPort: http
