apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: nexolor
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexolor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nexolor
    spec:
      containers:
        - name: fraud-service
          image: nexolor/fraud-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: redis-velocity
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017/fraud
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: SPRING_DATA_REDIS_HOST }
            - name: GRPC_SERVER_PORT
              value: "9090"
            - name: FRAUD_RULES_AMOUNT_CEILING_MINOR
              value: "10000000"
            - name: FRAUD_RULES_VELOCITY_MAX_TRANSFERS
              value: "5"
            - name: FRAUD_RULES_VELOCITY_WINDOW
              value: 60s
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: ZIPKIN_ENDPOINT }
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
# gRPC Service — plain L4 ClusterIP works fine for HTTP/2 gRPC; the wallet
# resolves it via in-cluster DNS (fraud-service:9090).
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: nexolor
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/part-of: nexolor
spec:
  selector:
    app.kubernetes.io/name: fraud-service
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service-health
  namespace: nexolor
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/part-of: nexolor
spec:
  selector:
    app.kubernetes.io/name: fraud-service
  ports:
    - name: http
      port: 8081
      targetPort: http
