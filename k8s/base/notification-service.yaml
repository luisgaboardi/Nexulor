apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexolor
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexolor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nexolor
    spec:
      containers:
        - name: notification-service
          image: nexolor/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017/notifications
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: SPRING_KAFKA_BOOTSTRAP_SERVERS }
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: ZIPKIN_ENDPOINT }
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nexolor
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: nexolor
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8082
      targetPort: http
