apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nexolor
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: nexolor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: nexolor
    spec:
      containers:
        - name: api-gateway
          image: nexolor/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: SPRING_PROFILES_ACTIVE }
            - name: JWT_LOCAL_SECRET
              valueFrom:
                secretKeyRef: { name: nexolor-secrets, key: JWT_LOCAL_SECRET }
            - name: WALLET_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: WALLET_SERVICE_URL }
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: NOTIFICATION_SERVICE_URL }
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: ZIPKIN_ENDPOINT }
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nexolor
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: nexolor
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8088
      targetPort: http
      nodePort: 30088
