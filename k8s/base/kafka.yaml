# Single-node KRaft broker (no PV for the showcase). Production: replicated
# StatefulSet with persistent storage, external reachability and TLS/SASL.
#
# KRaft specifics: the quorum voter and the advertised listener use the
# StatefulSet pod DNS (kafka-0.kafka-headless) instead of the ClusterIP
# Service — inside a cluster the broker would otherwise have to hairpin
# through kube-proxy to reach its own controller port, which is fragile.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: nexolor
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: nexolor
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: nexolor
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: nexolor
spec:
  clusterIP: None
  # Publish kafka-0 even before it is Ready: the broker must resolve its own
  # headless DNS to register with the KRaft quorum (otherwise deadlock).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: nexolor
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: nexolor
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: nexolor
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-headless:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 8
