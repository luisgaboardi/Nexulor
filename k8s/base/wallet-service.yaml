apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: nexolor
  labels:
    app.kubernetes.io/name: wallet-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexolor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nexolor
    spec:
      containers:
        - name: wallet-service
          image: nexolor/wallet-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: grpc-fraud
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: SPRING_DATASOURCE_URL }
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: SPRING_DATA_REDIS_HOST }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: SPRING_KAFKA_BOOTSTRAP_SERVERS }
            - name: GRPC_CLIENT_FRAUDSERVICE_ADDRESS
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: GRPC_CLIENT_FRAUDSERVICE_ADDRESS }
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: nexolor-config, key: ZIPKIN_ENDPOINT }
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: nexolor
  labels:
    app.kubernetes.io/name: wallet-service
    app.kubernetes.io/part-of: nexolor
spec:
  selector:
    app.kubernetes.io/name: wallet-service
  ports:
    - name: http
      port: 8080
      targetPort: http
